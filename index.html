<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温氏单词</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #121520;
            color: #eef;
            padding: 16px;
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: #1e2435;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
        }
        textarea {
            width: 100%;
            background: #2b3248;
            color: white;
            border: none;
            border-radius: 14px;
            padding:14px;
            font-size:16px;
            min-height:160px;
            outline: none;
        }
        .btn-row{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap:12px;
            margin:14px 0;
        }
        button{
            padding:14px;
            border-radius:12px;
            border:none;
            font-size:17px;
            cursor:pointer;
        }
        .btn-blue{background:#3b78f0;color:white;}
        .btn-gray{background:#444b60;color:white;}
        .btn-right{background:#39b54a;color:white;}
        .btn-wrong{background:#ed4c4c;color:white;}
        .big-word{
            font-size:42px;
            text-align:center;
            margin:12px 0;
        }
        .answer-display{
            font-size:24px;
            text-align:center;
            margin:10px 0 20px;
            color:#8cf;
        }
        .theme-switch{
            float:right;
            font-size:26px;
            background:transparent;
        }
        .result-right{color:#7cf087; text-align:center;font-size:22px;}
        .result-wrong{color:#ff7b7b; text-align:center;font-size:22px;}
    </style>
</head>
<body>
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1>📚 温氏单词</h1>
        <button class="theme-switch" id="darkToggle">🌙</button>
    </div>

    <!-- 导入单词区域 -->
    <div class="card">
        <h2>导入单词</h2>
        <p style="color:#b8c0e0">格式：英文,词性,中文 一行一个，英文,n.,苹果</p>
        <textarea id="wordText" placeholder="粘贴单词列表...
apple,n.,苹果
run,v.,跑
beautiful,adj.,美丽的"></textarea>
        <div class="btn-row">
            <button class="btn-blue" id="loadBtn">加载单词</button>
            <button class="btn-gray" id="backupBtn">备份数据</button>
        </div>
        <div class="btn-row">
            <button class="btn-gray" id="restoreBtn">恢复数据</button>
            <button class="btn-gray" id="clearBtn">清空全部</button>
        </div>
        <div id="loadTip" style="margin-top:10px;text-align:center;color:#8cf;"></div>
    </div>

    <!-- 背诵设置 -->
    <div class="card">
        <h2>背诵设置</h2>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
            <span>本轮题量：</span>
            <input type="number" id="countInput" value="20" style="width:80px;padding:8px;border-radius:8px;">
            <span>(超过总词数按总词数算)</span>
        </div>
        <div class="btn-row">
            <button class="btn-blue" id="modeEnCn">英文 → 猜中文</button>
            <button class="btn-blue" id="modeCnEn">中文 → 猜英文</button>
        </div>
    </div>

    <!-- 背诵卡片【核心！这里新增默写输入框，原有按钮全部保留】 -->
    <div class="card">
        <div id="statusText" style="text-align:center;font-size:22px;color:#b8c0e0;">未开始</div>
        <!-- 题目展示区（apple单词） -->
        <div class="big-word" id="showWord"></div>
        <!-- 答案展示区 -->
        <div class="answer-display" id="showAnswerBox"></div>
        <div id="resultTip"></div>

        <!-- =====【新增默写答题输入框，就在单词下面、按钮上方】===== -->
        <div id="answer-input-area" style="margin:16px 0;">
            <input type="text" id="answerInput" placeholder="在这里输入你的答案..." style="width:100%;padding:12px;font-size:18px;border-radius:10px;border:1px solid #ccc;background:#2b3248;color:#fff;">
            <div style="display:flex;gap:8px;margin-top:10px;">
                <button id="submitAnswerBtn" style="flex:1;padding:10px;background:#3b78f0;color:white;border:none;border-radius:8px;">提交答案</button>
            </div>
        </div>
        <!-- ============================================= -->

        <div class="btn-row">
            <button class="btn-blue" id="startBtn">开始本轮</button>
            <button class="btn-gray" id="showAnswerBtn">显示答案</button>
            <button class="btn-right" id="btnRight">答对</button>
            <button class="btn-wrong" id="btnWrong">答错</button>
        </div>
    </div>

    <!-- 统计面板 -->
    <div class="card">
        <h3>📊 统计</h3>
        <div id="statText">总单词：0 | 已掌握：0 | 本轮：0/0 | 答对：0 | 答错：0 | 正确率：0%</div>
    </div>

<script>
// 全局变量
let wordList = [];
let currentWord = null;
let mode = 'en2cn'; // en2cn英文猜中文 / cn2en中文猜英文
let remainWords = [];
let rightCount = 0;
let wrongCount = 0;

// DOM元素
const wordText = document.getElementById('wordText');
const loadBtn = document.getElementById('loadBtn');
const backupBtn = document.getElementById('backupBtn');
const restoreBtn = document.getElementById('restoreBtn');
const clearBtn = document.getElementById('clearBtn');
const countInput = document.getElementById('countInput');
const modeEnCn = document.getElementById('modeEnCn');
const modeCnEn = document.getElementById('modeCnEn');
const startBtn = document.getElementById('startBtn');
const statusText = document.getElementById('statusText');
const showWord = document.getElementById('showWord');
const showAnswerBox = document.getElementById('showAnswerBox');
const resultTip = document.getElementById('resultTip');
const loadTip = document.getElementById('loadTip');
const statText = document.getElementById('statText');
const btnRight = document.getElementById('btnRight');
const btnWrong = document.getElementById('btnWrong');
const showAnswerBtn = document.getElementById('showAnswerBtn');

// 【默写答题模块DOM】
const answerInputArea = document.getElementById('answer-input-area');
const answerInput = document.getElementById('answerInput');
const submitAnswerBtn = document.getElementById('submitAnswerBtn');

// ==========加载单词函数==========
loadBtn.onclick = function(){
    loadTip.textContent = "";
    const rawText = wordText.value;
    const lines = rawText.split('\n');
    wordList = [];

    for(let line of lines){
        const lineTrim = line.trim();
        if(lineTrim === "") continue;
        const arr = lineTrim.split(/[,，\t]+/);
        if(arr.length >=3){
            wordList.push({
                en: arr[0].trim(),
                pos: arr[1].trim(),
                cn: arr[2].trim(),
                right:0,
                wrong:0
            })
        }
    }
    localStorage.setItem('wordData', JSON.stringify(wordList));
    loadTip.textContent = `✅ 成功导入 ${wordList.length} 个单词`;
    setTimeout(()=> loadTip.textContent="", 3000);
    updateStat();
}

// 本地存储读取
window.onload = function(){
    const saved = localStorage.getItem('wordData');
    if(saved) wordList = JSON.parse(saved);
    updateStat();
}

// 更新统计面板
function updateStat(){
    let total = wordList.length;
    let master = wordList.filter(w=>w.right>=2).length;
    let allRight = wordList.reduce((sum,w)=>sum+w.right,0);
    let allWrong = wordList.reduce((sum,w)=>sum+w.wrong,0);
    let totalTry = allRight + allWrong;
    let rate = totalTry===0 ? 0 : Math.round(allRight/totalTry*100);
    statText.innerHTML = `总单词：${total} | 已掌握：${master} | 本轮：${remainWords.length>0 ? (wordList.length - remainWords.length)+"/"+wordList.length : "0/0"} | 答对：${allRight} | 答错：${allWrong} | 正确率：${rate}%`;
}

// 备份单词
backupBtn.onclick = function(){
    const dataStr = JSON.stringify(wordList,null,2);
    const blob = new Blob([dataStr],{type:'text/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "word_backup.json";
    a.click();
}

// 恢复单词
restoreBtn.onclick = function(){
    const inp = document.createElement('input');
    inp.type='file';
    inp.accept='.json';
    inp.onchange = e=>{
        const fr = new FileReader();
        fr.onload = res=>{
            wordList = JSON.parse(res.target.result);
            localStorage.setItem('wordData', JSON.stringify(wordList));
            loadTip.textContent="✅ 恢复成功";
            updateStat();
            setTimeout(()=> loadTip.textContent="",3000);
        }
        fr.readAsText(e.target.files[0]);
    }
    inp.click();
}

// 清空单词
clearBtn.onclick = function(){
    if(confirm("确定清空所有单词？")){
        wordList = [];
        localStorage.removeItem('wordData');
        wordText.value="";
        loadTip.textContent="✅ 单词已清空";
        updateStat();
        setTimeout(()=> loadTip.textContent="",3000);
    }
}

// 切换背诵模式
modeEnCn.onclick = ()=>{mode='en2cn';loadTip.textContent="模式：英文 → 猜中文";setTimeout(()=> loadTip.textContent="",2000);}
modeCnEn.onclick = ()=>{mode='cn2en';loadTip.textContent="模式：中文 → 猜英文";setTimeout(()=> loadTip.textContent="",2000);}

// 开始本轮背诵
startBtn.onclick = function(){
    if(wordList.length ===0){
        loadTip.textContent="⚠️ 请先导入单词！";
        setTimeout(()=> loadTip.textContent="",2500);
        return;
    }
    const total = parseInt(countInput.value) || 20;
    remainWords = [...wordList];
    shuffle(remainWords);
    remainWords = remainWords.slice(0,total);
    nextWord();
}

// 切换下一题
function nextWord(){
    if(remainWords.length === 0){
        statusText.textContent = "🎉 本轮背诵完成！";
        showWord.textContent = "";
        showAnswerBox.textContent = "";
        resultTip.textContent = "";
        answerInput.value = "";
        updateStat();
        return;
    }
    currentWord = remainWords.shift();
    showAnswerBox.textContent = "";
    resultTip.textContent = "";
    answerInput.value = "";
    if(mode === 'en2cn'){
        showWord.textContent = `${currentWord.en} 【${currentWord.pos}】`;
    }else{
        showWord.textContent = currentWord.cn;
    }
    statusText.textContent = `剩余 ${remainWords.length} 题`;
    updateStat();
}

// 显示答案按钮
showAnswerBtn.onclick = function(){
    if(mode === 'en2cn'){
        showAnswerBox.textContent = `答案：${currentWord.cn}`;
    }else{
        showAnswerBox.textContent = `答案：${currentWord.en}【${currentWord.pos}】`;
    }
}

// 答对按钮
btnRight.onclick = function(){
    currentWord.right +=1;
    localStorage.setItem('wordData', JSON.stringify(wordList));
    updateStat();
    setTimeout(nextWord,1000);
}
// 答错按钮
btnWrong.onclick = function(){
    currentWord.wrong +=1;
    localStorage.setItem('wordData', JSON.stringify(wordList));
    updateStat();
    setTimeout(nextWord,1000);
}

// =====【新增默写提交答案逻辑】=====
submitAnswerBtn.onclick = function(){
    const userAns = answerInput.value.trim().toLowerCase();
    let rightAns;
    if(mode === 'en2cn'){
        rightAns = currentWord.cn.toLowerCase();
    }else{
        rightAns = currentWord.en.toLowerCase();
    }
    if(userAns === rightAns){
        resultTip.innerHTML = `<div class="result-right">✅ 回答正确！</div>`;
        setTimeout(()=>{btnRight.click();},800);
    }else{
        resultTip.innerHTML = `<div class="result-wrong">❌ 错误！正确答案：${rightAns}</div>`;
        setTimeout(()=>{btnWrong.click();},800);
    }
}
// 回车提交
answerInput.addEventListener('keydown',function(e){
    if(e.key === 'Enter') submitAnswerBtn.click();
})

// 洗牌函数
function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]] = [arr[j],arr[i]];
    }
}

// 深色浅色切换
const darkToggle = document.getElementById('darkToggle');
let dark = true;
darkToggle.onclick = function(){
    dark = !dark;
    if(dark){
        document.body.style.background='#121520';
        document.body.style.color='#eef';
        darkToggle.textContent='🌙';
    }else{
        document.body.style.background='#ffffff';
        document.body.style.color='#222';
        darkToggle.textContent='☀️';
    }
}
</script>
</body>
</html>
